info:
  project:
    version: "0.1.1"

server:
  port: 45600

spring:
  application:
    name: fyrn-aggregation
  profiles:
    active: prod
  main:
    allow-circular-references: true
    banner-mode: off
  datasource:
    driver-class-name: ${fyrn.datasource.driver-class-name}
    url: jdbc:mysql://${fyrn.datasource.host}:${fyrn.datasource.port}/${fyrn.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${fyrn.datasource.username}
    password: ${fyrn.datasource.password}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
  data:
    redis:
      host: ${fyrn.redis.host}
      port: ${fyrn.redis.port}
      password: ${fyrn.redis.password:}
      database: ${fyrn.redis.database:0}

logging:
  level:
    root: ${fyrn.logging.level}

mybatis-plus:
  configuration:
    log-impl: ${fyrn.mybatis.log-impl:org.apache.ibatis.logging.nologging.NoLoggingImpl}
  global-config:
    banner: false

oss:
  protocol: ${fyrn.oss.protocol}
  access-key-id: ${fyrn.oss.access-key-id}
  access-key-secret: ${fyrn.oss.access-key-secret}
  bucket-name: ${fyrn.oss.bucket-name}
  endpoint: ${fyrn.oss.endpoint}
  region: ${fyrn.oss.region}

sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: token
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true